{{# include "nav/OverviewNav.html" #}}

{{ define "Sidebar" }}
<aside class="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-content">
        <span>In this section</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
    </button>
    <div class="sidebar-content" id="sidebar-content">
        {{ $currentPath := .Res.FullPath }}

        <nav class="section-nav">
            {{ if (Contains $currentPath "/overview/") }}
                {{ template "OverviewNav" . }}
            {{ else }}
                <div class="section-nav-content">
                    <h3>Start here</h3>
                    <ul>
                        <li><a href="{{.Site.PathPrefix}}/overview/">Overview</a></li>
                    </ul>
                </div>
            {{ end }}
        </nav>
    </div>
</aside>
{{ end }}
